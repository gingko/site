[[redirects]]
  from = "/download/win"
  to = "https://github.com/gingko/client/releases/download/v2.4.15/Gingko-Setup-2.4.15.exe"

[[redirects]]
  from = "/download/macos"
  to = "https://github.com/gingko/client/releases/download/v2.4.15/Gingko-2.4.15.dmg"

[[redirects]]
  from = "/download/linux"
  to = "https://github.com/gingko/client/releases/download/v2.4.15/Gingko-2.4.15.AppImage"

[build]
  command = "hugo"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.154.5"
  NODE_VERSION = "22"

